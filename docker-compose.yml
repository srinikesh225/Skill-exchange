# SkillPulse India — full stack with PostgreSQL.
# NOTE: provided for the Postgres/Docker deployment path. It was NOT run on the build
# machine (Docker was unavailable), so treat it as provided-not-verified. The verified
# path is the SQLite quickstart in README.md.
#
#   docker compose up --build
#   frontend: http://localhost:3000   ·   API: http://localhost:8000/docs

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skillpulse
      POSTGRES_PASSWORD: skillpulse
      POSTGRES_DB: skillpulse
    # Deliberately NOT published to the host: a judge running a local PostgreSQL
    # on 5432 would otherwise get a port-bind failure and the whole stack would
    # fail to start. The backend reaches it over the compose network as `db`.
    # For ad-hoc inspection use: docker compose exec db psql -U skillpulse -d skillpulse
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://skillpulse:skillpulse@db:5432/skillpulse
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Seeding PostgreSQL on first start takes ~15-20s; the frontend waits for
    # this so a judge's first page load never lands mid-seed.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into next.config rewrites() at build time so /api/* proxies to
        # the backend service over the compose network.
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
